name: Bump
on:
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch: ~

permissions: read-all

jobs:
  npm-transitive:
    name: package-lock.json
    runs-on: ubuntu-26.04
    steps:
      - name: Verify action checksums
        uses: $/.github/actions/ghasum
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm clean-install
      - name: Update dependencies
        run: |
          npm update --prefer-dedupe
      - name: Restore runtime dependency versions
        run: |
          npm install which@7.0.0
          sed -i 's/"which": "7.0.0"/"which": "^7.0.0"/g' package*.json

          npm install --save-peer @ericcornelissen/lregexp@1.0.9
          sed -i '/  "peerDependencies": {/,/^  }/ s/    "@ericcornelissen\/lregexp": "1\.0\.9"/    "@ericcornelissen\/lregexp": "^1.0.9"/' package*.json
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          title: Bump transitive dependencies
          body: |
            _This Pull Request was created automatically._
          labels: dependencies
          add-paths: package.json, package-lock.json
          branch: bump-transitive-dependencies
          commit-message: Bump transitive dependencies with `npm update`
  tooling:
    name: .tool-versions
    runs-on: ubuntu-26.04
    steps:
      - name: Verify action checksums
        uses: $/.github/actions/ghasum
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Update tooling
        uses: ericcornelissen/tool-versions-update-action/pr@v2.2.4
        with:
          commit-message: Bump {{updated-tools}} from {{updated-old-versions}} to {{updated-new-versions}}
          labels: dependencies
          max: 1
          pr-title: Bump {{updated-tools}} from {{updated-old-versions}} to {{updated-new-versions}}
          install-tools: false
